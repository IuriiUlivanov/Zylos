plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def repoRoot = rootProject.projectDir.parentFile.parentFile
def generatedAssets = layout.buildDirectory.dir("generated/map-assets")
def defaultApiUrl = "http://10.0.2.2:3000"
def apiUrl = providers.gradleProperty("zylos.apiUrl")
        .orElse(providers.environmentVariable("ZYLOS_API_URL"))
        .orElse(defaultApiUrl)
        .get()

def prepareMapAssets = tasks.register("prepareMapAssets", Copy) {
    def style = new File(repoRoot, "infra/preview/style-mobile.json")
    def water = new File(repoRoot, "infra/preview/water-fill.geojson")
    def mbtiles = new File(repoRoot, "data/tiles/novi-sad.mbtiles")
    from(style)
    from(water)
    if (mbtiles.isFile() && mbtiles.length() > 0L) {
        from(mbtiles)
    }
    into(generatedAssets)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

android {
    namespace "rs.zylos.novisad"
    compileSdk 35

    defaultConfig {
        applicationId "rs.zylos.novisad"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_URL", "\"${apiUrl}\""
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        debug {
            debuggable true
            manifestPlaceholders.usesCleartext = "true"
        }
        release {
            minifyEnabled false
            manifestPlaceholders.usesCleartext = "false"
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets.named("main") {
        assets.srcDir(generatedAssets)
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.configureEach { task ->
    if (task.name == "preBuild" || (task.name.startsWith("merge") && task.name.endsWith("Assets"))) {
        task.dependsOn(prepareMapAssets)
    }
}

dependencies {
    implementation "org.maplibre.gl:android-sdk:13.5.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-moshi:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "com.squareup.moshi:moshi:1.15.1"
    implementation "com.squareup.moshi:moshi-kotlin:1.15.1"
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.10"
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"
    ksp "androidx.room:room-compiler:2.8.4"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
}
